[versions]
configurate = "4.2.0-SNAPSHOT"
paper = "26.3.build.205-stable"
guice = "7.0.0"
adventure = "5.2.0"
vault = "1.7.1"
placeholderApi = "2.11.5"
bstats = "3.0.2"
luckperms = "5.4"
palantir-java-format = "2.97.0"
spotless = "8.10.1"

[libraries]
miniMessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventureApi = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventureLegacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
adventureAnsi = { group = "net.kyori", name = "adventure-text-serializer-ansi", version.ref = "adventure" }
adventurePlaintext = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
configurateYaml = { group = "org.spongepowered", name = "configurate-yaml", version.ref = "configurate" }
guice = { group = "com.google.inject", name = "guice", version.ref = "guice" }
paperApi = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
vault = { group = "com.github.MilkBowl", name = "VaultAPI", version.ref = "vault" }
placeholderApi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderApi" }
bstatsBukkit = { group = "org.bstats", name = "bstats-bukkit", version.ref = "bstats" }
lucko-luckperms = { group = "net.luckperms", name = "api", version.ref = "luckperms" }

[bundles]
adventure = [ "adventureApi", "adventureLegacy", "adventureAnsi", "adventurePlaintext", "miniMessage" ]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
palantir-java-format = { id = "com.palantir.java-format-spotless", version.ref = "palantir-java-format" }